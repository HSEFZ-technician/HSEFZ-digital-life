name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI uses SQLite so no database service is needed.
  DB_ENGINE: django.db.backends.sqlite3
  DB_NAME: ci.sqlite3
  SECRET_KEY: ci-only-secret-key
  JWT_SECRET_KEY: ci-only-jwt-secret
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      # Migrations are git-ignored in this repo, so generate them before testing.
      - name: Generate migrations
        run: python manage.py makemigrations club bingo league volunteer youth_league record verification

      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=text >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  test-mysql:
    name: Test (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        # Django 6.x requires MySQL 8.4+
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: selection_users
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: selection_users
      DB_USER: root
      DB_PASSWORD: ci-root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate migrations
        run: python manage.py makemigrations club bingo league volunteer youth_league record verification

      - name: Apply migrations to MySQL
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest
