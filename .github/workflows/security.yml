name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"   # weekly, catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "bandit[sarif]"
      # Full report (all severities) goes to the repo's Security > Code scanning tab.
      - name: Bandit full report (SARIF)
        run: >
          bandit -r . -f sarif -o bandit.sarif --exit-zero
          -x ./tests,./.git,./static,./templates,./club/backup
      - uses: github/codeql-action/upload-sarif@v4
        # Fork PRs have no permission to upload SARIF.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: bandit.sarif
          category: bandit
      # Blocking gate: fail on medium or higher severity findings.
      - name: Bandit gate (medium+)
        run: bandit -r . -ll -x ./tests,./.git,./static,./templates,./club/backup

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  django-deploy-check:
    name: Django deploy checklist
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ci.sqlite3
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install -r requirements.txt
      # Informational until HTTPS settings (HSTS, secure cookies, SSL redirect) are decided.
      - name: manage.py check --deploy
        continue-on-error: true
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          set -o pipefail
          python manage.py check --deploy --fail-level WARNING 2>&1 | tee deploy-check.txt \
            || { echo "::warning title=Django deploy check::Deployment security warnings found (see job summary)"; exit 1; }
      - name: Summary
        if: always()
        run: |
          echo '### Django deploy check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat deploy-check.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install pip-audit
      # Informational for now: djangorestframework-jwt pins an old PyJWT with known CVEs.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt \
            || { echo "::warning title=pip-audit::Vulnerable dependencies found (see log)"; exit 1; }

  dependency-review:
    name: Dependency review (new deps in PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
